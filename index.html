
<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRANSLAT KHMER NEW PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif}
header{background:linear-gradient(135deg,#0756d9,#722be7);padding:25px 15px;text-align:center}
header h1{font-size:23px;margin:5px}
header p{margin:8px 0}
.container{padding:16px;max-width:650px;margin:auto}
.card{background:#1e293b;padding:17px;border-radius:14px;margin:14px 0}
h3{color:#65b5ff;margin-top:0}
label{display:block;margin:12px 0 6px}
textarea,select,input{width:100%;padding:12px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white;font-size:16px}
textarea{min-height:110px;resize:vertical}
button{border:0;border-radius:9px;padding:13px;margin-top:12px;background:#1677ff;color:white;font-size:16px;font-weight:bold;width:100%}
button:active{opacity:.7}
.green{background:#059669}
.purple{background:#7c3aed}
video{width:100%;margin-top:12px;border-radius:10px}
#status{color:#facc15;margin-top:12px}
footer{text-align:center;color:#94a3b8;padding:20px}
</style>
</head>
<body>

<header>
<h1>🌐 TRANSLAT KHMER NEW PRO</h1>
<p>កម្មវិធីបកប្រែភាសា និងវីដេអូជាភាសាខ្មែរ</p>
</header>

<div class="container">

<div class="card">
<h3>📝 ១. បកប្រែភាសា</h3>
<label>ជ្រើសរើសភាសាដើម</label>
<select id="source">
<option value="en">English</option>
<option value="th">Thai</option>
<option value="zh-CN">Chinese</option>
<option value="vi">Vietnamese</option>
<option value="fr">French</option>
<option value="ja">Japanese</option>
<option value="ko">Korean</option>
<option value="lo">Lao</option>
</select>

<label>បញ្ចូលអត្ថបទដែលចង់បកប្រែ</label>
<textarea id="original" placeholder="សរសេរអត្ថបទនៅទីនេះ..."></textarea>

<button onclick="translateText()">🔄 បកប្រែទៅជាភាសាខ្មែរ</button>

<label>លទ្ធផលភាសាខ្មែរ</label>
<textarea id="result" placeholder="លទ្ធផលបកប្រែនឹងបង្ហាញនៅទីនេះ"></textarea>

<button class="green" onclick="speak()">🔊 ស្តាប់សំឡេងខ្មែរ</button>
<button class="purple" onclick="copyResult()">📋 ចម្លងអត្ថបទ</button>
<p id="status"></p>
</div>

<div class="card">
<h3>🎬 ២. ជ្រើសរើសវីដេអូ</h3>
<input type="file" id="videoFile" accept="video/*">
<video id="video" controls style="display:none"></video>
<p>ជ្រើសរើសវីដេអូពីទូរស័ព្ទរបស់អ្នក។</p>
</div>

<div class="card">
<h3>💬 ៣. បង្កើតចំណងជើងរង SRT</h3>
<label>អត្ថបទចំណងជើងរងជាភាសាខ្មែរ</label>
<textarea id="subtitle" placeholder="បញ្ចូលអត្ថបទចំណងជើងរង..."></textarea>
<button class="green" onclick="makeSRT()">⬇️ ទាញយកឯកសារ SRT</button>
</div>

<div class="card">
<h3>🔊 ៤. សំឡេងអានភាសាខ្មែរ</h3>
<textarea id="voiceText" placeholder="បញ្ចូលអត្ថបទខ្មែរ..."></textarea>
<button onclick="speakVoice()">▶️ ចាប់ផ្តើមអាន</button>
<button class="purple" onclick="speechSynthesis.cancel()">⏹ បញ្ឈប់សំឡេង</button>
</div>

</div>

<footer>
TRANSLAT KHMER NEW PRO<br>
Version 1.0 | Khmer Language App
</footer>

<script>
async function translateText(){
 const text=document.getElementById('original').value.trim();
 const lang=document.getElementById('source').value;
 const status=document.getElementById('status');
 if(!text){status.textContent='សូមបញ្ចូលអត្ថបទជាមុន';return;}
 status.textContent='កំពុងបកប្រែ...';
 try{
  const url='https://api.mymemory.translated.net/get?q='+
  encodeURIComponent(text)+'&langpair='+lang+'|km';
  const response=await fetch(url);
  const data=await response.json();
  if(data.responseStatus!==200)throw Error('Translation failed');
  document.getElementById('result').value=data.responseData.translatedText;
  document.getElementById('subtitle').value=data.responseData.translatedText;
  document.getElementById('voiceText').value=data.responseData.translatedText;
  status.textContent='បកប្រែបានជោគជ័យ!';
 }catch(e){
  status.textContent='មិនអាចបកប្រែបានទេ។ សូមពិនិត្យអ៊ីនធឺណិត ហើយសាកល្បងម្ដងទៀត។';
 }
}
function speak(){
 const t=document.getElementById('result').value;
 readKhmer(t);
}
function speakVoice(){
 const t=document.getElementById('voiceText').value;
 readKhmer(t);
}
function readKhmer(t){
 if(!t.trim()){alert('សូមបញ្ចូលអត្ថបទជាមុន');return;}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);
 u.lang='km-KH';
 u.rate=0.85;
 speechSynthesis.speak(u);
}
function copyResult(){
 const t=document.getElementById('result').value;
 if(!t){alert('មិនទាន់មានអត្ថបទទេ');return;}
 navigator.clipboard.writeText(t).then(()=>alert('ចម្លងបានជោគជ័យ'));
}
document.getElementById('videoFile').addEventListener('change',function(){
 const f=this.files[0];
 if(!f)return;
 const v=document.getElementById('video');
 v.src=URL.createObjectURL(f);
 v.style.display='block';
});
function makeSRT(){
 const t=document.getElementById('subtitle').value.trim();
 if(!t){alert('សូមបញ្ចូលអត្ថបទជាមុន');return;}
 const lines=t.split(/\n+/);
 let srt='';
 lines.forEach((line,i)=>{
  srt+=(i+1)+'\n00:00:'+String(i*4).padStart(2,'0')+',000 --> 00:00:'+String(i*4+4).padStart(2,'0')+',000\n'+line+'\n\n';
 });
 const blob=new Blob(['\uFEFF'+srt],{type:'text/plain;charset=utf-8'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='TRANSLAT-KHMER.srt';
 a.click();
 URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
